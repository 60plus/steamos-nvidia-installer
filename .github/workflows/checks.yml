name: Script checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and update safeguards
        run: python3 -m unittest discover -s tests -v
      - name: Check every shell script
        run: shellcheck -S warning $(git ls-files '*.sh') scripts/steamos-nvidia-diagnostics
